name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install backend dependencies
        run: npm --prefix backend install

      - name: Run test:all (Frontend + Backend Test Suites)
        env:
          APP_PIN: '1234'
          SESSION_SECRET: 'bufin-ci-session-secret-32-chars-minimum-length!'
          NODE_ENV: 'test'
        run: npm run test:all
