<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BUFIN - Business Ledger</title>
  <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BUFIN">
  <meta name="theme-color" content="#FFFFFF">
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#090D16" media="(prefers-color-scheme: dark)">
  <meta property="og:image" content="/png/og-image-1200x630.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/style.css?v=5.0">
  <link rel="stylesheet" href="css/login.css?v=5.0">
  <link rel="stylesheet" href="css/invoice.css?v=5.0">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script>
    try { fetch('/api/ping', { priority: 'low' }).catch(function(){}); } catch(e) {}
    window.debounce = function(fn, ms) {
      var timer;
      ms = ms || 300;
      return function() {
        var ctx = this, args = arguments;
        clearTimeout(timer);
        timer = setTimeout(function() { fn.apply(ctx, args); }, ms);
      };
    };
    window.hardReloadBufin = async function() {
      try {
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          for (var i = 0; i < regs.length; i++) await regs[i].unregister();
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          for (var j = 0; j < keys.length; j++) await caches.delete(keys[j]);
        }
      } catch (e) {
        console.warn('Hard reload cache purge error:', e);
      }
      var clean = window.location.origin + window.location.pathname + '?_t=' + Date.now() + window.location.hash;
      window.location.replace(clean);
    };
  </script>
</head>
<body>
  <!-- PIN Login Screen rendered directly in HTML -->
  <div id="pinScreen" class="login-screen">
    <div class="login-card" id="loginCard">
      <!-- Left Side: App Branding & Logo -->
      <div class="login-brand-side">
        <div class="logo-circle" title="BUFIN - PD Enterprises">
          <img src="/svg/logo.svg" alt="BUFIN" class="login-app-logo">
        </div>
        <h2 class="login-brand-title">BUFIN</h2>
        <p class="login-brand-sub">PD ENTERPRISES</p>
        <div class="login-brand-tag">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <span>SECURE LEDGER ACCESS</span>
        </div>
      </div>

      <!-- Right Side: PIN Entry Form & Pad -->
      <div class="login-pin-side">
        <div class="login-pin-prompt">
          <p class="login-pin-title">Enter 4-Digit PIN</p>
          <p class="login-pin-sub">Access business ledger &amp; financials</p>
        </div>

        <div class="pin-display">
          <div class="pin-dot" id="dot0"></div>
          <div class="pin-dot" id="dot1"></div>
          <div class="pin-dot" id="dot2"></div>
          <div class="pin-dot" id="dot3"></div>
        </div>

        <div class="pin-keypad">
          <button type="button" class="pin-btn" data-n="1">1</button>
          <button type="button" class="pin-btn" data-n="2">2</button>
          <button type="button" class="pin-btn" data-n="3">3</button>
          <button type="button" class="pin-btn" data-n="4">4</button>
          <button type="button" class="pin-btn" data-n="5">5</button>
          <button type="button" class="pin-btn" data-n="6">6</button>
          <button type="button" class="pin-btn" data-n="7">7</button>
          <button type="button" class="pin-btn" data-n="8">8</button>
          <button type="button" class="pin-btn" data-n="9">9</button>
          <button type="button" class="pin-btn fn" id="pinClear">C</button>
          <button type="button" class="pin-btn" data-n="0">0</button>
          <button type="button" class="pin-btn fn" id="pinBack">&#x232B;</button>
        </div>

        <div class="pin-error" id="pinError"></div>
      </div>
    </div>
  </div>

  <!-- App Elements (hidden by default until unlocked) -->
  <aside id="nav" aria-label="Main Navigation" style="display:none"></aside>
  <main id="appMain" style="display:none">
    <div id="syncBanner" class="sync-banner" style="display:none"></div>
    <div id="syncPillBar" class="sync-pill-bar">
      <div id="syncPill" class="sync-status-pill saved" title="Sync status">
        <span class="sync-dot"></span>
        <span class="sync-text">Saved</span>
      </div>
    </div>
    <div id="v"></div>
  </main>
  <div id="ov" data-a="menu"></div>
  <nav id="tab" aria-label="Quick navigation" style="display:none"></nav>
  <div id="toast" role="alert"></div>
  <dialog id="dlg"></dialog>

  <script type="module" src="js/app.js?v=5.0"></script>
  <script>
    if ('serviceWorker' in navigator) {
      var swRefreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', function() {
        if (!swRefreshing) {
          swRefreshing = true;
          window.location.reload();
        }
      });
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/sw.js', { scope: '/' })
          .then(function(reg) {
            reg.update().catch(function() {});
          })
          .catch(function(err) { console.warn('SW registration failed:', err); });
      });
    }
  </script>
</body>
</html>
